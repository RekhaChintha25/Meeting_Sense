# Render Blueprint: backend only (frontend deploy on Vercel)
# Repo root must contain a "backend" folder. If Render says "Root directory backend does not exist",
# ensure the backend folder is committed and pushed to your GitHub repo.

services:
  - type: web
    name: meeting-sense-api
    runtime: python
    rootDir: backend

    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      # Add Azure/Whisper vars in Render Dashboard: Environment
      # AZURE_OPENAI_API_KEY, AZURE_OPENAI_ENDPOINT, AZURE_OPENAI_CHAT_DEPLOYMENT,
      # AZURE_WHISPER_ENDPOINT, AZURE_WHISPER_API_KEY (or AZURE_GPT_MINI_* if using those names)
